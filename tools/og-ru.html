<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#EDF1F6;color:#14213D;font-family:Onest,sans-serif;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:48px;padding:0 72px;box-sizing:border-box}
.eb{font-family:"JetBrains Mono",monospace;font-size:20px;letter-spacing:.12em;color:#5A6782;text-transform:uppercase}
h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:150px;letter-spacing:-.03em;margin:10px 0 0;line-height:1}
h1 span{color:#2F6FEB}
.tag{font-family:Unbounded,sans-serif;font-weight:500;font-size:34px;line-height:1.2;margin-top:18px}
.chips{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid #D6DDE8;border-radius:999px;padding:9px 16px;font-size:20px;font-weight:600;display:flex;gap:10px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;background:#178A5C}
.pass{background:#fff;border:1px solid #D6DDE8;border-radius:24px;padding:30px 30px 78px;box-shadow:0 30px 60px -30px rgba(20,33,61,.45);position:relative}
.pass b{font-family:Unbounded,sans-serif;font-size:20px;letter-spacing:.06em}
.row{display:grid;grid-template-columns:86px 1fr;gap:20px;margin-top:22px;align-items:center}
.ph{width:86px;height:100px;border-radius:14px;background:#E3ECFE;color:#2F6FEB;display:grid;place-items:center}
dt{color:#5A6782;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
dd{margin:0 0 8px;font-family:"JetBrains Mono",monospace;font-size:17px}
dl{margin:0}
.st{position:absolute;right:26px;bottom:22px;transform:rotate(-12deg);border:3px solid #178A5C;color:#178A5C;border-radius:12px;padding:6px 14px;font-family:Unbounded,sans-serif;font-weight:700;font-size:16px;letter-spacing:.08em}
.mrz{margin-top:16px;border-top:1px dashed #D6DDE8;padding-top:14px;font-family:"JetBrains Mono",monospace;font-size:14px;color:#5A6782}
</style></head><body>
<div>
  <div class="eb">Интерактивная инфографика</div>
  <h1>A<span>A</span>uth</h1>
  <div class="tag">Паспорт, подпись и доверенное лицо для <span style="white-space:nowrap">ИИ-агентов</span></div>
  <div class="chips"><span class="chip"><i></i>5 режимов с анимацией</span><span class="chip"><i></i>Симулятор миссии</span></div>
</div>
<div class="pass">
  <b>ПАСПОРТ АГЕНТА</b>
  <div class="row">
    <div class="ph"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7.5" width="16" height="12" rx="3.5"/><path d="M12 7.5V4"/><circle cx="12" cy="3" r="1"/><circle cx="9" cy="13.5" r="1.4" fill="currentColor"/><circle cx="15" cy="13.5" r="1.4" fill="currentColor"/><path d="M2 12.5v3M22 12.5v3"/></svg></div>
    <dl><dt>Кто</dt><dd>aauth:assistant@agent.example</dd><dt>Представитель</dt><dd>https://ps.example</dd></dl>
  </div>
  <div class="mrz">KEY Ed25519 · ДЕЙСТВУЕТ ≤ 24 Ч</div>
  <div class="st">ПОДПИСЬ ВЕРНА</div>
</div>
</body></html>
